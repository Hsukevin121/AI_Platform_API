apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-management-rapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-management-rapp
  template:
    metadata:
      labels:
        app: device-management-rapp
    spec:
      containers:
      - name: device-management-rapp-container
        image: hsukevin121/device-management-rapp:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: device-management-rapp-service
spec:
  selector:
    app: device-management-rapp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
